# Use together with compose.yaml after configuring .env and DNS. This does not publish by itself.
services:
  api:
    environment:
      DEBUG: '0'
    restart: unless-stopped
  db:
    restart: unless-stopped
  jobs:
    environment:
      DEBUG: '0'
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set your domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
